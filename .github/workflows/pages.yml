name: Deploy to Pages

# Only on main, and by hand when needed. A deploy per feature branch would fight over the one
# environment GitHub Pages gives a repository.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the tree, and hold the two tokens the Pages deploy itself needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-published site is worse than a
# slightly stale one. Queued duplicates collapse into the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # A project page is served from /<repo>/, so every asset URL needs that prefix. Vite
          # reads this, and the router reads it back through import.meta.env.BASE_URL.
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Add SPA fallback
        # Pages serves 404.html for any path it has no file for. Handing it the app means a deep
        # link like /setlists/hard boots the router instead of showing GitHub's not-found page.
        # The router then reads the real URL and renders the right screen.
        run: cp client/dist/index.html client/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    # Split from the build so a failed build never replaces a working site.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
