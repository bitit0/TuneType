name: Deploy server to Cloud Run

# Only when the server, its shared types or the image definition actually change. The client lives
# in the same repository and deploys to Pages; a CSS tweak has no business rebuilding a container.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'shared/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

permissions:
  contents: read
  # Lets the runner mint a short-lived OIDC token. This is what makes the deploy keyless — see the
  # Deploying section of the README for the one-time setup that trusts it.
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloud-run
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: tunetype-api
          region: ${{ vars.GCP_REGION || 'us-central1' }}
          # Cloud Build compiles the Dockerfile, so the runner needs no Docker of its own.
          source: .
          # --max-instances caps the blast radius. Cloud Run's default is 100, and this is a
          # personal project whose own daily search budget is 80 calls: there is no traffic that
          # three instances cannot serve, and a runaway loop or a scraper cannot bill past them.
          flags: --allow-unauthenticated --max-instances=3
          env_vars: |-
            ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }}
            ADMIN_EMAILS=${{ vars.ADMIN_EMAILS }}
            YOUTUBE_SEARCH_DAILY_BUDGET=${{ vars.YOUTUBE_SEARCH_DAILY_BUDGET || '80' }}
            TRUST_PROXY_HOPS=1
          # The only real secret. Firestore needs none: the service the container runs as carries
          # its own identity, which is the whole reason this project is on Cloud Run.
          secrets: |-
            YOUTUBE_API_KEY=youtube-api-key:latest

      - run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
